
services:

  mongodb:
    image: mongo:latest
    container_name: mongodb_fei
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:15
    container_name: postgres_fei
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  cassandra:
    image: cassandra:latest
    container_name: cassandra_fei
    restart: always
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: FEICluster
      # Colocando o Cassandra de dieta (Limite de 512MB de RAM)
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    volumes:
      - cassandra_data:/var/lib/cassandra
      
  neo4j:
    image: neo4j:latest
    container_name: neo4j_fei
    restart: always
    ports:
      - "7474:7474" 
      - "7687:7687" 
    environment:
      - NEO4J_AUTH=neo4j/senha123 
    volumes:
      - neo4j_data:/data

  
  app_python:
    build: ./src
    container_name: python_fei
    depends_on:
      - mongodb
      - postgres
      - cassandra
      - neo4j
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_HOST: mongodb
      MONGO_USER: admin
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    stdin_open: true
    tty: true
    volumes:
      - ./src:/app


volumes:
  mongo_data:
  pg_data:
  cassandra_data:
  neo4j_data: 
